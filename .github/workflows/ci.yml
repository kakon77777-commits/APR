name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  client-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install site tooling
        run: npm ci --prefix site
      - name: Client behavior tests
        run: npm run test:client --prefix site

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Format check
        run: ruff format --check apr_runtime tests examples
      - name: Lint
        run: ruff check apr_runtime tests examples
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Build distributions
        if: matrix.python-version == '3.14'
        run: python -m build
