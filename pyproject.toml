[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "apr-runtime-mvp"
version = "0.10.0"
description = "Adaptive Perceptual Reading and Agentic Perception Runtime research MVP"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
authors = [{ name = "kakon77777-commits" }]
keywords = [
  "adaptive perception",
  "agentic perception",
  "evidence governance",
  "multimodal agents",
  "world state",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
desktop = [
  "mss>=10.2",
  "pywinauto>=0.6.8; platform_system == 'Windows'",
]
browser = ["playwright>=1.49"]
vertex = ["google-auth>=2.40,<3"]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<10",
  "ruff>=0.16,<0.17",
]

[project.urls]
Homepage = "https://github.com/kakon77777-commits/APR"
Repository = "https://github.com/kakon77777-commits/APR.git"
Issues = "https://github.com/kakon77777-commits/APR/issues"

[tool.setuptools]
packages = ["apr_runtime"]
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"examples/*.py" = ["E402"]
"tests/*.py" = ["E402"]
